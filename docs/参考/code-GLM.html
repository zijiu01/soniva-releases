<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soniva — 开发日志</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        border: 'hsl(240 5.9% 90%)',
        muted: { DEFAULT: 'hsl(240 4.8% 95.9%)', fg: 'hsl(240 3.8% 46.1%)' },
        background: 'hsl(0 0% 100%)',
        foreground: 'hsl(240 10% 3.9%)',
        primary: { DEFAULT: 'hsl(240 5.9% 10%)', fg: 'hsl(0 0% 98%)' },
        card: { DEFAULT: 'hsl(0 0% 100%)', fg: 'hsl(240 10% 3.9%)' },
        ring: 'hsl(240 5.9% 10%)',
      },
      borderRadius: { lg: '0.5rem', md: 'calc(0.5rem - 2px)', sm: 'calc(0.5rem - 4px)' },
      fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
    }
  }
}
</script>
<style>
  * { border-color: hsl(240 5.9% 90%); }
  .card { @apply rounded-lg border bg-card text-card-fg shadow-sm; }
  .badge { @apply inline-flex items-center rounded-md border px-2.5 py-0.5 text-xs font-medium transition-colors; }
  .btn { @apply inline-flex items-center justify-center gap-2 rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring disabled:opacity-50 h-9 px-4; }
</style>
</head>
<body class="bg-background text-foreground font-sans antialiased">

<!-- ===== Header ===== -->
<header class="sticky top-0 z-50 w-full border-b bg-background/80 backdrop-blur supports-[backdrop-filter]:bg-background/60">
  <div class="max-w-7xl mx-auto flex h-14 items-center justify-between px-6">
    <a href="#" class="flex items-center gap-2 font-semibold tracking-tight">
      <span class="flex h-6 w-6 items-center justify-center rounded-md bg-primary text-primary-fg text-xs font-bold">S</span>
      Soniva
    </a>
    <nav class="flex items-center gap-6 text-sm text-muted-fg">
      <a href="#" class="transition-colors hover:text-foreground">下载</a>
      <a href="#" class="transition-colors hover:text-foreground">版本记录</a>
      <a href="#" class="transition-colors hover:text-foreground">文档</a>
      <a href="#" class="transition-colors hover:text-foreground">定价</a>
      <a href="#" class="transition-colors hover:text-foreground">协议</a>
      <a href="#" class="btn bg-primary text-primary-fg hover:bg-primary/90 shadow">进入应用</a>
    </nav>
  </div>
</header>

<main>
  <!-- ===== Hero ===== -->
  <section class="relative overflow-hidden border-b">
    <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(ellipse_at_top_right,hsl(240_4.8%_95.9%),transparent_60%)]"></div>
    <div class="max-w-7xl mx-auto px-6 py-20 lg:py-28 relative">
      <span class="badge border-transparent bg-muted text-muted-fg">开发日志</span>
      <h1 class="mt-4 text-4xl font-bold tracking-tight lg:text-5xl">记录每一次的进步</h1>
      <p class="mt-4 max-w-xl text-base text-muted-fg leading-relaxed">
        这里是 Soniva 桌面端的开发日志：版本发布与开发文档汇成一条时间线，可以按日期快速定位，也可以下载最新的发布包。
      </p>
      <div class="mt-8 flex items-center gap-3">
        <a href="#timeline" class="btn bg-primary text-primary-fg hover:bg-primary/90 shadow">查看最新日志</a>
        <a href="#" class="btn border bg-background hover:bg-muted hover:text-foreground shadow-sm">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          下载最新包
        </a>
      </div>
    </div>
  </section>

  <!-- ===== Content ===== -->
  <section class="max-w-7xl mx-auto px-6 py-12 grid grid-cols-1 lg:grid-cols-[300px_1fr] gap-10">

    <!-- Sidebar -->
    <aside class="space-y-6">

      <!-- Search -->
      <div class="relative">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-muted-fg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" placeholder="搜索日志或关键词..." class="flex h-10 w-full rounded-md border bg-transparent px-3 py-2 pl-9 text-sm placeholder:text-muted-fg focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">
      </div>

      <!-- Heatmap quick nav -->
      <div class="card p-5">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-sm font-semibold">快速定位</h3>
          <span class="text-xs text-muted-fg">2026 · 42 条</span>
        </div>
        <div class="grid grid-cols-3 gap-x-4 gap-y-5 text-[10px] text-muted-fg" id="heatmap">
          <!-- generated by script -->
        </div>
      </div>

      <!-- Releases -->
      <div class="card">
        <div class="border-b px-5 py-3.5">
          <h3 class="text-sm font-semibold">最新发布包</h3>
        </div>
        <ul class="divide-y text-sm" id="releases"></ul>
      </div>
    </aside>

    <!-- Timeline -->
    <div id="timeline">
      <h2 class="text-lg font-semibold tracking-tight mb-6">2026 年 9 月</h2>
      <ol class="relative border-l ml-2 space-y-10" id="timelineList"></ol>
    </div>
  </section>
</main>

<footer class="border-t py-8">
  <p class="max-w-7xl mx-auto px-6 text-sm text-muted-fg">© 2026 Soniva · Developer Changelog</p>
</footer>

<script>
// ---- Releases data ----
const releases = [
  { v: 'v0.1.5', date: '2026-09-27' },
  { v: 'v0.1.4', date: '2026-09-25' },
  { v: 'v0.1.3', date: '2026-09-24' },
  { v: 'v0.1.2', date: '2026-09-20' },
];
document.getElementById('releases').innerHTML = releases.map(r => `
  <li class="flex items-center justify-between px-5 py-3 hover:bg-muted/50 transition-colors">
    <div>
      <div class="font-medium">${r.v}</div>
      <div class="text-xs text-muted-fg">${r.date}</div>
    </div>
    <button class="btn h-8 w-8 p-0 border bg-background shadow-sm hover:bg-muted">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
    </button>
  </li>`).join('');

// ---- Heatmap ----
const months = ['12月','11月','10月','9月','8月','7月','6月','5月','4月','3月','2月','1月'];
// activity level: 0-4 per day
const activity = { '9月': 2, '8月': 1, '7月': 1 };
document.getElementById('heatmap').innerHTML = months.map(m => {
  const lvl = activity[m] || 0;
  const cells = Array.from({length: 42}, (_, i) => {
    let c = 'bg-muted';
    if (lvl > 0 && Math.random() < 0.35 * lvl) c = lvl >= 2 ? 'bg-primary/70' : 'bg-primary/30';
    return `<span class="h-2 w-2 rounded-[2px] ${c}"></span>`;
  }).join('');
  return `<div><div class="mb-1.5 text-center">${m}</div><div class="grid grid-cols-7 gap-[3px] justify-items-center">${cells}</div></div>`;
}).join('');

// ---- Timeline entries ----
const entries = [
  { date: '9月27日', type: 'release', tag: '发布', version: '发布包 v0.1.5', iso: '2026-09-27',
    title: 'Soniva 0.1.5',
    desc: 'Soniva 桌面端 0.1.5 发布。Developer ID 签名 + Apple 公证通过...' },
  { date: '9月27日', type: 'dev', tag: '开发日志', iso: '2026-09-27',
    title: '桌面端开发日志 · 2026-09-27',
    desc: '当日 4 个提交（新功能 2 个，修复 2 个）。主要涉及：watch-folder、...' },
  { date: '9月26日', type: 'dev', tag: '开发日志', iso: '2026-09-26',
    title: '桌面端开发日志 · 2026-09-26',
    desc: '当日 24 个提交（修复 11 个，新功能 9 个，文档 3 个，其他 1 个）。主要涉...' },
  { date: '9月25日', type: 'release', tag: '发布', version: '发布包 v0.1.4', iso: '2026-09-25',
    title: 'Soniva 0.1.4',
    desc: 'Soniva 桌面端 0.1.4 发布。Developer ID 签名 + Apple 公证通过...' },
];

document.getElementById('timelineList').innerHTML = entries.map(e => `
  <li class="relative pl-8">
    <span class="absolute -left-[7px] top-1 h-3.5 w-3.5 rounded-full border-2 border-primary bg-background"></span>
    <div class="text-xs text-muted-fg mb-3">${e.date}</div>
    <div class="card p-5 hover:shadow-md transition-shadow">
      <div class="flex flex-wrap items-center gap-2 mb-2">
        <span class="badge ${e.type === 'release'
          ? 'border-transparent bg-primary text-primary-fg'
          : 'bg-muted text-muted-fg border-transparent'}">${e.tag}</span>
        ${e.version ? `<span class="text-xs text-muted-fg">📦 ${e.version}</span>` : ''}
        <span class="text-xs text-muted-fg">🗓 ${e.iso}</span>
      </div>
      <h3 class="font-semibold tracking-tight">${e.title}</h3>
      <p class="mt-1.5 text-sm text-muted-fg leading-relaxed">${e.desc}</p>
    </div>
  </li>`).join('');
</script>

</body>
</html>
