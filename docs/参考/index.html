<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soniva · 开发日志</title>
  <style>
    :root{
      --bg:#fff;
      --fg:#09090b;
      --muted:#71717a;
      --muted-2:#a1a1aa;
      --border:#e4e4e7;
      --border-soft:#f0f0f2;
      --card:#fff;
      --soft:#fafafa;
      --soft-2:#f4f4f5;
      --primary:#18181b;
      --primary-fg:#fafafa;
      --radius:10px;
      --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.035);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;background:var(--bg);color:var(--fg);
      font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",
        "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      font-size:14px;line-height:1.5;
    }
    button,input{font:inherit}
    button{cursor:pointer}
    .container{width:min(1120px,calc(100% - 40px));margin:auto}
    .topbar{
      height:64px;border-bottom:1px solid var(--border);
      display:flex;align-items:center;background:rgba(255,255,255,.9);
      position:sticky;top:0;z-index:20;backdrop-filter:blur(12px);
    }
    .nav{display:flex;align-items:center;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:-.02em}
    .logo{
      width:25px;height:25px;border:1.5px solid #18181b;border-radius:7px;
      display:grid;place-items:center;
    }
    .logo svg{width:15px;height:15px}
    .navlinks{display:flex;align-items:center;gap:4px}
    .navlinks a{
      color:#52525b;text-decoration:none;padding:7px 10px;border-radius:7px;
      transition:.15s;
    }
    .navlinks a:hover{color:var(--fg);background:var(--soft-2)}
    .navlinks .active{color:var(--fg)}
    .nav-login{
      margin-left:8px;border:1px solid var(--border);background:#fff;
      border-radius:8px;padding:7px 12px;color:var(--fg);
    }
    .hero{padding:72px 0 58px;border-bottom:1px solid var(--border)}
    .hero-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:48px;align-items:center}
    .eyebrow{
      display:inline-flex;align-items:center;gap:7px;padding:4px 9px;
      border:1px solid var(--border);border-radius:999px;background:var(--soft);
      color:#52525b;font-size:12px;margin-bottom:18px;
    }
    .dot{width:6px;height:6px;background:#18181b;border-radius:50%}
    h1{
      margin:0;font-size:44px;line-height:1.08;letter-spacing:-.045em;
      font-weight:720;
    }
    .hero p{color:var(--muted);font-size:15px;max-width:610px;margin:18px 0 24px}
    .actions{display:flex;gap:9px;flex-wrap:wrap}
    .btn{
      height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--border);
      background:#fff;color:var(--fg);display:inline-flex;align-items:center;gap:8px;
      text-decoration:none;font-weight:500;transition:.15s;
    }
    .btn:hover{background:var(--soft)}
    .btn-primary{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
    .btn-primary:hover{background:#27272a}
    .hero-art{height:220px;border:1px solid var(--border);border-radius:16px;background:
      linear-gradient(135deg,#fafafa 0%,#fff 65%);position:relative;overflow:hidden}
    .hero-art:before,.hero-art:after{
      content:"";position:absolute;border:1px solid var(--border);border-radius:10px;
      background:#fff;box-shadow:var(--shadow)
    }
    .hero-art:before{width:245px;height:145px;right:30px;top:27px;transform:rotate(-3deg)}
    .hero-art:after{width:245px;height:145px;right:8px;top:44px;opacity:.6;transform:rotate(3deg)}
    .art-card{
      position:absolute;z-index:2;right:48px;top:47px;width:245px;height:145px;
      border:1px solid var(--border);border-radius:10px;background:#fff;padding:18px;
      box-shadow:0 12px 28px rgba(0,0,0,.06)
    }
    .line{height:7px;background:#f4f4f5;border-radius:5px;margin-bottom:11px}
    .line.s{width:54%}.line.m{width:72%}.line.l{width:90%}
    .content{padding:34px 0 80px}
    .layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:44px}
    .sidebar{position:sticky;top:88px;align-self:start}
    .search{
      height:38px;border:1px solid var(--border);border-radius:8px;
      display:flex;align-items:center;gap:8px;padding:0 11px;background:#fff;
      box-shadow:0 1px 1px rgba(0,0,0,.02)
    }
    .search svg{color:var(--muted-2);flex:none}
    .search input{border:0;outline:0;width:100%;color:var(--fg);background:transparent}
    .search input::placeholder{color:#a1a1aa}
    .side-card{border:1px solid var(--border);border-radius:10px;margin-top:14px;background:#fff}
    .side-head{padding:14px 14px 9px;font-weight:600}
    .months{padding:0 12px 13px}
    .year-row{display:flex;align-items:center;justify-content:space-between;padding:5px 2px 11px}
    .year{font-weight:600}
    .count{color:var(--muted);font-size:12px}
    .month-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
    .month-block{min-width:0}
    .month-name{font-size:11px;color:var(--muted);margin:0 0 5px}
    .heat{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
    .cell{aspect-ratio:1;border-radius:2px;background:#e4e4e7}
    .cell.hot{background:#18181b}
    .cell.mid{background:#a1a1aa}
    .releases{padding:0 14px 10px}
    .release{
      display:flex;align-items:center;justify-content:space-between;
      padding:11px 0;border-top:1px solid var(--border-soft)
    }
    .release:first-child{border-top:0}
    .release strong{display:block;font-size:13px}
    .release span{display:block;color:var(--muted);font-size:11px;margin-top:2px}
    .icon-btn{border:0;background:transparent;color:var(--muted);padding:5px;border-radius:6px}
    .icon-btn:hover{background:var(--soft-2);color:var(--fg)}
    .timeline-head{
      display:flex;align-items:end;justify-content:space-between;margin-bottom:24px;
      padding-bottom:14px;border-bottom:1px solid var(--border)
    }
    .timeline-head h2{font-size:18px;margin:0;letter-spacing:-.02em}
    .timeline-head span{font-size:12px;color:var(--muted)}
    .month-title{
      font-size:13px;font-weight:650;color:#52525b;margin:25px 0 14px;
      display:flex;align-items:center;gap:10px
    }
    .month-title:after{content:"";height:1px;background:var(--border-soft);flex:1}
    .item{position:relative;padding-left:25px;padding-bottom:23px}
    .item:before{
      content:"";position:absolute;left:5px;top:6px;width:9px;height:9px;
      border:2px solid #a1a1aa;background:#fff;border-radius:50%;z-index:2
    }
    .item:after{
      content:"";position:absolute;left:9px;top:17px;bottom:0;width:1px;background:var(--border)
    }
    .item:last-child:after{display:none}
    .date{font-size:12px;color:var(--muted);margin:0 0 7px}
    .entry{
      border:1px solid var(--border);border-radius:11px;background:var(--card);
      padding:16px;display:flex;gap:16px;align-items:flex-start;
      transition:.16s;box-shadow:0 1px 1px rgba(0,0,0,.015)
    }
    .entry:hover{border-color:#d4d4d8;box-shadow:var(--shadow);transform:translateY(-1px)}
    .entry-main{flex:1;min-width:0}
    .meta{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;margin-bottom:7px}
    .tag{
      display:inline-flex;padding:2px 7px;border-radius:999px;background:var(--soft-2);
      color:#52525b;font-size:11px;font-weight:500
    }
    .entry h3{font-size:15px;margin:0 0 7px;letter-spacing:-.015em}
    .entry p{font-size:13px;color:var(--muted);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .entry-icon{
      width:64px;height:64px;flex:none;border:1px solid var(--border);
      border-radius:9px;background:var(--soft);display:grid;place-items:center;color:#71717a
    }
    .empty{display:none;text-align:center;padding:55px 10px;color:var(--muted)}
    @media(max-width:800px){
      .container{width:min(100% - 28px,680px)}
      .navlinks a:nth-child(-n+3){display:none}
      .hero{padding:48px 0}
      .hero-grid{grid-template-columns:1fr}
      .hero-art{display:none}
      h1{font-size:36px}
      .layout{grid-template-columns:1fr;gap:25px}
      .sidebar{position:static}
      .month-grid{grid-template-columns:repeat(3,1fr)}
    }
    @media(max-width:520px){
      .container{width:calc(100% - 24px)}
      .nav-login{display:none}
      .hero p{font-size:14px}
      .entry{padding:13px}
      .entry-icon{width:52px;height:52px}
      .month-grid{gap:12px 7px}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <div class="brand">
        <span class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M4 13h3l2-6 4 11 2-6h5"/>
          </svg>
        </span>
        Soniva
      </div>
      <nav class="navlinks">
        <a href="#">下载</a><a class="active" href="#">版本记录</a><a href="#">文档</a><a href="#">定价</a><a href="#">协议⌄</a>
        <button class="nav-login">进入应用 →</button>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="container hero-grid">
      <div>
        <div class="eyebrow"><span class="dot"></span> 开发日志</div>
        <h1>记录每一次的进步</h1>
        <p>这里是 Soniva 桌面端的开发日志：版本发布与开发文档汇成一条时间线。快速找到你关心的更新，也可以随时下载最新版本。</p>
        <div class="actions">
          <a class="btn btn-primary" href="#timeline">查看最新日志 ↓</a>
          <a class="btn" href="#releases">下载最新包</a>
        </div>
      </div>
      <div class="hero-art" aria-hidden="true">
        <div class="art-card">
          <div class="line l"></div><div class="line m"></div><div class="line l"></div>
          <div class="line s"></div><div class="line m"></div><div class="line s"></div>
        </div>
      </div>
    </div>
  </section>

  <main class="content" id="timeline">
    <div class="container layout">
      <aside class="sidebar">
        <label class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>
          </svg>
          <input id="search" placeholder="搜索日志或关键词..." />
        </label>

        <div class="side-card">
          <div class="side-head">快速定位</div>
          <div class="months">
            <div class="year-row"><span class="year">⌄ 2026</span><span class="count">42 条</span></div>
            <div class="month-grid" id="heatmap"></div>
          </div>
        </div>

        <div class="side-card" id="releases">
          <div class="side-head">最新发布包</div>
          <div class="releases">
            <div class="release"><div><strong>v0.1.5</strong><span>2026-09-27</span></div><button class="icon-btn" title="下载">↓</button></div>
            <div class="release"><div><strong>v0.1.4</strong><span>2026-09-25</span></div><button class="icon-btn" title="下载">↓</button></div>
            <div class="release"><div><strong>v0.1.3</strong><span>2026-09-24</span></div><button class="icon-btn" title="下载">↓</button></div>
            <div class="release"><div><strong>v0.1.2</strong><span>2026-09-20</span></div><button class="icon-btn" title="下载">↓</button></div>
          </div>
        </div>
      </aside>

      <section>
        <div class="timeline-head">
          <div><h2>更新记录</h2></div>
          <span id="resultCount">6 条记录</span>
        </div>
        <div id="list"></div>
        <div class="empty" id="empty">没有找到匹配的日志</div>
      </section>
    </div>
  </main>

  <script>
    const entries = [
      {date:'2026-09-27', type:'发布', title:'Soniva 0.1.5', text:'Soniva 桌面端 0.1.5 发布。Developer ID 签名 + Apple 公证通过，优化安装与更新体验。', icon:'box'},
      {date:'2026-09-27', type:'开发日志', title:'桌面端开发日志 · 2026-09-27', text:'当日 4 个提交（新功能 2 个，修复 2 个）。主要涉及 watch-folder、文件监听与更新流程。', icon:'file'},
      {date:'2026-09-26', type:'开发日志', title:'桌面端开发日志 · 2026-09-26', text:'当日 24 个提交（修复 11 个，新功能 9 个，文档 3 个，其他 1 个）。主要涉及窗口与媒体处理。', icon:'file'},
      {date:'2026-09-25', type:'发布', title:'Soniva 0.1.4', text:'Soniva 桌面端 0.1.4 发布。Developer ID 签名 + Apple 公证通过。', icon:'box'},
      {date:'2026-09-25', type:'开发日志', title:'桌面端开发日志 · 2026-09-25', text:'完成文件夹监听、状态反馈与多项交互细节优化。', icon:'file'},
      {date:'2026-09-24', type:'发布', title:'Soniva 0.1.3', text:'修复若干稳定性问题，并优化启动速度与资源加载。', icon:'box'}
    ];

    const icon = type => type === 'box'
      ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m21 8-9-5-9 5 9 5 9-5Z"/><path d="M3 8v9l9 5 9-5V8"/><path d="M12 13v9"/></svg>'
      : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h6"/></svg>';

    function render(list){
      const root = document.getElementById('list');
      root.innerHTML = '';
      const groups = {};
      list.forEach(x => (groups[x.date.slice(0,7)] ??= []).push(x));
      Object.entries(groups).forEach(([month, items]) => {
        const title = document.createElement('div');
        title.className = 'month-title';
        title.textContent = month.replace('-', ' 年 ') + ' 月';
        root.appendChild(title);
        items.forEach(x => {
          const item = document.createElement('article');
          item.className = 'item';
          item.innerHTML = `
            <div class="date">${x.date}</div>
            <div class="entry">
              <div class="entry-main">
                <div class="meta"><span class="tag">${x.type}</span><span>•</span><span>${x.date}</span></div>
                <h3>${x.title}</h3>
                <p>${x.text}</p>
              </div>
              <div class="entry-icon">${icon(x.icon)}</div>
            </div>`;
          root.appendChild(item);
        });
      });
      document.getElementById('resultCount').textContent = `${list.length} 条记录`;
      document.getElementById('empty').style.display = list.length ? 'none' : 'block';
    }

    function buildHeatmap(){
      const root = document.getElementById('heatmap');
      const months = ['12月','11月','10月','9月','8月','7月','6月','5月','4月','3月','2月','1月'];
      months.forEach((m, mi) => {
        const b = document.createElement('div'); b.className='month-block';
        b.innerHTML = `<div class="month-name">${m}</div><div class="heat"></div>`;
        const heat=b.querySelector('.heat');
        for(let i=0;i<28;i++){
          const c=document.createElement('span'); c.className='cell';
          if(mi===3 && i<18) c.classList.add(i%4===0?'mid':'hot');
          else if((mi+i)%9===0) c.classList.add('mid');
          heat.appendChild(c);
        }
        root.appendChild(b);
      });
    }

    document.getElementById('search').addEventListener('input', e=>{
      const q=e.target.value.trim().toLowerCase();
      render(entries.filter(x => `${x.title} ${x.text} ${x.type} ${x.date}`.toLowerCase().includes(q)));
    });

    buildHeatmap(); render(entries);
  </script>
</body>
</html>
